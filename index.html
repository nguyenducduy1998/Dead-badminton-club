function norm(s){const x=Object.assign(def(),s||{});x.members=x.members||[];if(!x.members.some(m=>m.id==='admin'))x.members.unshift(adminRec());x.exp=x.exp||[];x.stock=x.stock||{q:0,log:[]};if(x.stock.q===undefined)x.stock={q:(x.stock.tubes||0)*12,log:(x.stock.log||[]).map(l=>({...l,d:l.d*12}))};return x}
async function save(){const{error}=await SB.from('club_data').upsert({id:'main',state:S});
 if(error){conn='err';setConn();toast('Lỗi lưu dữ liệu')}render()}
async function init(){
 const{data,error}=await SB.from('club_data').select('state').eq('id','main').maybeSingle();
 if(error){conn='err'}else if(data&&data.state){S=norm(data.state)}else{await SB.from('club_data').upsert({id:'main',state:S})}
 SB.channel('club').on('postgres_changes',{event:'*',schema:'public',table:'club_data'},p=>{
  if(p.new&&p.new.state){const old=new Set((S.notifs||[]).map(n=>n.id));S=norm(p.new.state);if(isAdmin()){const nn=S.notifs.filter(n=>!old.has(n.id));if(nn.length)toast('🔔 '+nn[nn.length-1].text)}if(me&&me!=='admin'&&!mem(me)){logout();return}if(me&&!isTyping())render()}})
  .subscribe(st=>{conn=st==='SUBSCRIBED'?'ok':'err';setConn()});
 if(!error)conn='ok';render();
}
function isTyping(){const a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='SELECT')}
function setConn(){const e=$('conn');if(!e)return;e.textContent=conn==='ok'?'● Online':conn==='err'?'● Lỗi kết nối':'● Đang kết nối';e.className='chip '+(conn==='ok'?'bg-emerald-100 text-emerald-800':conn==='err'?'bg-red-100 text-red-700':'bg-yellow-100 text-yellow-800')}

/* ---------- Auth ---------- */
function login(){const u=$('lu').value.trim(),p=$('lp').value;
 if(u==='duy.ndd'&&p==='Maianh@2001'){me='admin'}
 else{const m=S.members.find(m=>m.id!=='admin'&&(m.user||m.nick).toLowerCase()===u.toLowerCase()&&m.pass===p);if(!m)return toast('Sai tên đăng nhập hoặc mật khẩu');me=m.id}
 localStorage.setItem('dbc_me',me);tab=0;render()}
function logout(){me=null;memberMode=false;localStorage.removeItem('dbc_me');render()}
function register(){const name=$('rn').value.trim(),user=$('ru').value.trim().toLowerCase(),nick=$('rk').value.trim(),pass=$('rp').value;
 if(!name||!user||!nick||!pass)return toast('Điền đủ họ tên, tên đăng nhập, biệt danh, mật khẩu');
 if(!/^[a-z0-9._]+$/.test(user))return toast('Tên đăng nhập viết liền, không dấu (chữ, số, . _)');
 if(user==='duy.ndd'||S.members.some(m=>(m.user||'').toLowerCase()===user))return toast('Tên đăng nhập đã tồn tại');
 S.members.push({id:uid(),name,user,nick,pass,gender:regGender,level:regLevel,avatar:regAv,status:'pending'});
 notify('register',name+' ('+nick+') đăng ký tài khoản mới');authMode='login';save();toast('Đã gửi đăng ký, chờ Admin duyệt')}

}
function bellBtn(){const n=(S.notifs||[]).filter(x=>!x.read).length;

/* ---------- Countdown ---------- */
function tick(){document.querySelectorAll('[data-dl]').forEach(e=>{const d=new Date(e.dataset.dl)-new Date();
 if(d<=0){if(!e.dataset.x){e.dataset.x=1;e.textContent='Đã hết hạn vote';if(!isTyping())render()}return}
 const s=Math.floor(d/1e3),dd=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),ss=s%60,p=n=>String(n).padStart(2,'0');
 e.textContent='⏳ '+(dd?dd+'n ':'')+p(h)+':'+p(m)+':'+p(ss)})}
setInterval(tick,1000);

/* ---------- Member views ---------- */
function toggleVote(k){const u=mem(me),s=ens(k);
 if(u.status!=='approved')return toast('Tài khoản đang chờ Admin duyệt');

function mVote(){const u=mem(me);
 return planCal()+(u.status!=='approved'?'<div class="card bg-yellow-50 text-yellow-900 text-sm">Tài khoản đang chờ Admin duyệt. Sau khi được duyệt bạn mới bấm vote được.</div>':'')+
 tuesdays().map(k=>{const s=sess(k),on=s.votes.includes(me),lock=!s.open||expired(s)||s.cancelled;
 return `<div id="s_${k}" class="card scroll-mt-20"><div class="flex justify-between items-start"><div><div class="font-bold text-slate-800">${dlab(k)}</div><div class="text-sm text-gray-500">17:30 – 19:30</div></div><span class="chip ${s.cancelled?'bg-red-100 text-red-700':lock?'bg-gray-200 text-gray-600':'bg-indigo-100 text-indigo-800'}">${s.cancelled?'Đã hủy':lock?'Đã khóa':'Đang mở'}</span></div>
 ${s.deadline&&s.open&&!s.cancelled?`<div class="text-sm font-semibold text-orange-600 mt-1" data-dl="${s.deadline}"></div>`:''}
 <div class="text-sm mt-2 mb-1">Slot: <b>${used(s)}/${MAXS}</b></div>${voters(s)}
 <button class="btn w-full mt-2 ${on?'r':''}" ${lock&&!on||u.status!=='approved'||(lock&&on)?'disabled':''} onclick="toggleVote('${k}')">${s.cancelled?'Buổi đã hủy':on?'Hủy báo danh':used(s)>=MAXS?'Đã đầy':'Báo danh'}</button></div>`}).join('')}

const hasPlan=s=>s&&(s.open||s.votes.length||s.settled||s.guests||s.cancelled);
function mHist(){
 const y=calM.getFullYear(),mo=calM.getMonth(),off=(new Date(y,mo,1).getDay()+6)%7,days=new Date(y,mo+1,0).getDate();
 let cells='';for(let i=0;i<off;i++)cells+='<div></div>';
 for(let d=1;d<=days;d++){const dt=new Date(y,mo,d),k=dk(dt),ok=dt.getDay()===2&&hasPlan(S.sessions[k]);
  cells+=ok?`<button class="aspect-square rounded-lg text-sm font-bold ${selDay===k?'bg-indigo-800 text-white':'bg-indigo-100 text-slate-800'}" onclick="selDay='${k}';render()">${d}<div class="text-[9px]">●</div></button>`:`<div class="aspect-square flex items-center justify-center text-sm text-gray-300">${d}</div>`}
 let det='';if(selDay&&hasPlan(S.sessions[selDay])){const s=sess(selDay),total=s.settled?(s.total??((+s.court||0)+shCost(s))):null;
  det=`<div class="card"><div class="font-bold text-slate-800">${dlab(selDay)}</div>
  ${s.settled?`<div class="text-sm">Tổng chi phí: <b>${fmt(total)}</b> · Khách vãng lai: ${s.guests} (${fmt(s.guests*gp(s))})</div>`:(s.cancelled?'<span class="chip bg-red-100 text-red-700">Buổi đã hủy</span>':'<div class="text-sm text-gray-500">Chưa chốt chi phí</div>')}
  <div class="mt-2">${s.votes.length?s.votes.map(id=>{const m=mem(id);if(!m)return'';const t=S.tx.find(t=>t.k===selDay&&t.m===id);
   return `<div class="flex items-center gap-2 py-1.5 border-b border-gray-100"><span class="text-xl">${m.avatar}</span><span class="flex-1 text-sm">${dn(m)} ${badge(m)}</span>${(s.absent||[]).includes(id)?'<span class="chip bg-gray-200 text-gray-600">Vắng</span>':(m.id==='admin'&&s.settled)?`<span class="text-sm">${fmt(s.adminShare||0)}</span><span class="chip bg-indigo-100 text-indigo-800">Tự trả</span>`:t?`<span class="text-sm">${fmt(-t.a)}</span><span class="chip bg-indigo-100 text-indigo-800">Đã thanh toán</span>`:'<span class="chip bg-gray-200 text-gray-600">Chưa trừ</span>'}</div>`}).join(''):'<div class="text-sm text-gray-400">Không có người tham gia</div>'}</div></div>`}
 return `<div class="card"><div class="flex items-center justify-between mb-2"><button class="btn g" onclick="calM=new Date(${y},${mo-1},1);selDay=null;render()">‹</button><b>Tháng ${mo+1}/${y}</b><button class="btn g" onclick="calM=new Date(${y},${mo+1},1);selDay=null;render()">›</button></div>
 <div class="text-xs text-gray-500 mb-2">Chọn các thứ Ba có lịch đánh (chấm xanh) để xem chi tiết.</div>
 <div class="grid grid-cols-7 gap-1 text-center text-xs text-gray-400 mb-1">${['T2','T3','T4','T5','T6','T7','CN'].map(d=>`<div>${d}</div>`).join('')}</div><div class="grid grid-cols-7 gap-1">${cells}</div></div>${det}`}

function qrBlock(){return `<div class="card text-center"><div class="font-bold mb-2">Mã QR nộp quỹ</div><img src="${S.qr||QRDEF}" class="mx-auto rounded-lg max-h-96" onerror="this.outerHTML='<div class=\\'text-sm text-gray-400\\'>Chưa có mã QR</div>'"></div>`}
function mFund(){const l=S.tx.filter(t=>t.m===me),dep=l.filter(t=>t.a>0).reduce((a,t)=>a+t.a,0),ded=-l.filter(t=>t.a<0).reduce((a,t)=>a+t.a,0);
 return `<div class="card grid grid-cols-3 text-center gap-2"><div><div class="text-xs text-gray-500">Đã đóng</div><b class="text-indigo-700">${fmt(dep)}</b></div><div><div class="text-xs text-gray-500">Đã trừ</div><b class="text-red-600">${fmt(ded)}</b></div><div><div class="text-xs text-gray-500">Số dư</div><b class="${dep-ded<0?'text-red-600':''}">${fmt(dep-ded)}</b></div></div>
 ${dep-ded<0?`<div class="card bg-red-50 text-red-700 text-sm font-semibold">Số dư của bạn đang âm ${fmt(ded-dep)}. Vui lòng nạp thêm vào quỹ (quét mã QR bên dưới).</div>`:''}${qrBlock()}<div class="card"><div class="font-bold mb-1">Lịch sử giao dịch</div>${txList(l)}</div>`}

function doneSessions(){const now=new Date();return Object.keys(S.sessions).filter(k=>{const s=S.sessions[k];return endOf(k)<=now&&(s.votes.length||s.settled)&&!s.cancelled}).sort()}
function mStats(){
 const now=new Date(),all=doneSessions();let ks=all;
 const wk=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return dk(x)};
 if(statF==='last')ks=all.slice(-1);
 else if(statF==='week')ks=all.filter(k=>wk(new Date(k+'T00:00:00'))===wk(now));
 else if(statF==='month')ks=all.filter(k=>k.slice(0,7)===dk(now).slice(0,7));
 else if(statF==='year')ks=all.filter(k=>k.slice(0,4)===String(now.getFullYear()));
 const rows=S.members.filter(m=>m.status==='approved').map(m=>{const n=ks.filter(k=>att(S.sessions[k]).includes(m.id)).length;return{m,n,p:ks.length?Math.round(n/ks.length*100):0}}).sort((a,b)=>b.n-a.n||a.m.nick.localeCompare(b.m.nick));
 const F=[['last','Buổi'],['week','Tuần'],['month','Tháng'],['year','Năm'],['all','Tất cả']];
 return `<div class="flex gap-1.5 mb-3">${F.map(f=>`<button class="btn flex-1 ${statF===f[0]?'':'g'}" onclick="statF='${f[0]}';render()">${f[1]}</button>`).join('')}</div>
 <div class="card"><div class="text-sm text-gray-500 mb-2">Tổng số buổi: ${ks.length}</div>${rows.map((r,i)=>`<div class="flex items-center gap-2 py-2 border-b border-gray-100"><span class="w-6 text-center font-bold text-gray-400">${i+1}</span><span class="text-xl">${r.m.avatar}</span><span class="flex-1 font-medium">${dn(r.m)}</span><span class="text-sm">${r.n} buổi</span><b class="w-12 text-right text-indigo-700">${r.p}%</b></div>`).join('')||'<div class="text-sm text-gray-400">Chưa có dữ liệu</div>'}</div>`}

function mProfile(){const u=mem(me);persAv=persAv||u.avatar;
 return `<div class="card space-y-3"><div class="font-bold">Thông tin cá nhân</div>
 <div class="flex flex-wrap gap-1.5">${AV.map(a=>`<button class="avb ${a===persAv?'on':''}" onclick="persAv='${a}';render()">${a}</button>`).join('')}</div>
 <div class="flex gap-2">${['Nam','Nữ'].map(g=>`<button class="btn flex-1 ${u.gender===g?'':'g'}" onclick="setG('${g}')">${g}</button>`).join('')}</div>
 ${u.id==='admin'?'':`<select id="plv" class="inp">${LV.map(l=>`<option ${l===u.level?'selected':''}>${l}</option>`).join('')}</select>`}
 <button class="btn w-full" onclick="saveProfile()">Lưu thay đổi</button></div>
 ${u.id==='admin'?'':`<div class="card space-y-2"><div class="font-bold">Đổi mật khẩu</div><input id="op" type="password" class="inp" placeholder="Mật khẩu hiện tại"><input id="np" type="password" class="inp" placeholder="Mật khẩu mới"><button class="btn w-full" onclick="chgPass()">Đổi mật khẩu</button></div>`}
 <button class="btn r w-full" onclick="logout()">Đăng xuất</button>`}
function setG(g){mem(me).gender=g;save()}
function saveProfile(){const u=mem(me);u.avatar=persAv;if($('plv'))u.level=$('plv').value;save();toast('Đã lưu')}
function chgPass(){const u=mem(me);if($('op').value!==u.pass)return toast('Sai mật khẩu hiện tại');if(!$('np').value)return toast('Nhập mật khẩu mới');u.pass=$('np').value;save();toast('Đã đổi mật khẩu')}

/* ---------- Admin views ---------- */
function calc(s){const total=(+s.court||0)+shCost(s),rest=Math.max(0,total-s.guests*gp(s));
 const ms=att(s).map(mem).filter(Boolean),w=m=>m.gender==='Nữ'?.8:1,sw=ms.reduce((a,m)=>a+w(m),0)||1;
 return{total,rest,per:ms.map(m=>({m,amt:Math.round(rest*w(m)/sw/1000)*1000}))}}
function setS(k,f,v){ens(k)[f]=v;save()}
function guest(k,d){const s=ens(k);s.guests=Math.max(0,s.guests+d);if(used(s)>MAXS&&d>0){s.guests--;return toast('Đã đủ '+MAXS+' slot')}save()}
function rmVote(k,id){const s=ens(k);s.votes=s.votes.filter(x=>x!==id);s.absent=(s.absent||[]).filter(x=>x!==id);save()}
function toggleAbsent(k,id){const s=ens(k);s.absent=s.absent||[];const i=s.absent.indexOf(id);if(i>=0)s.absent.splice(i,1);else s.absent.push(id);save()}
function setCost(k,f,v){ens(k)[f]=+v||0;save()}
function dirty(k){const s=sess(k);if(!s.settled)return false;const c=calc(s),tx=S.tx.filter(t=>t.k===k);
 if(c.total!==s.total||(s.sqa||0)!==(s.tubes||0)*12+(s.loose||0)||(s.gc===undefined?s.guests:s.gc)!==s.guests)return true;
 const want=c.per.filter(r=>r.m.id!=='admin'),ad=c.per.find(r=>r.m.id==='admin');
 if(want.length!==tx.length||(s.adminShare||0)!==(ad?ad.amt:0))return true;
 return want.some(r=>!tx.find(t=>t.m===r.m.id&&t.a===-r.amt))}
function revertTx(k){const s=ens(k);S.tx=S.tx.filter(t=>t.k!==k);const sq=s.sqa!==undefined?s.sqa:(s.tubes||0)*12+(s.loose||0);
 if(sq){S.stock.q+=sq;S.stock.log.push({t:Date.now(),d:sq,note:'Hoàn tác/cập nhật buổi '+k})}s.sqa=0}
function applySettle(k){const s=ens(k),c=calc(s);
 c.per.forEach(r=>{if(r.m.id!=='admin')S.tx.push({id:uid(),m:r.m.id,a:-r.amt,type:'session',k,note:'Buổi chơi '+dlab(k),t:Date.now()})});
 const ad=c.per.find(r=>r.m.id==='admin');s.adminShare=ad?ad.amt:0;
 const sq=(s.tubes||0)*12+(s.loose||0);if(sq){S.stock.q-=sq;S.stock.log.push({t:Date.now(),d:-sq,note:'Dùng buổi '+k})}s.sqa=sq;
 s.total=c.total;s.gc=s.guests;s.settled=true}
function settle(k){const s=ens(k);if(s.cancelled)return toast('Buổi đã hủy, hãy khôi phục trước khi chốt');
 if(!att(s).length&&!s.guests)return toast('Chưa có ai có mặt');
 const upd=s.settled;if(!confirm(upd?'Cập nhật chia tiền buổi này? Các khoản đã trừ của buổi này sẽ được tính lại.':'Chốt buổi và trừ quỹ?'))return;
 if(upd)revertTx(k);else s.gp=GUEST;
 applySettle(k);save();toast(upd?'Đã cập nhật chia tiền':'Đã chốt buổi')}
function undo(k){if(!confirm('Hoàn tác chốt buổi này? Tiền đã trừ sẽ được hoàn lại cho hội viên.'))return;revertTx(k);const s=ens(k);s.settled=false;s.adminShare=0;save()}
let calP=new Date();
function goS(k){const e=document.getElementById('s_'+k);if(e&&e.scrollIntoView)e.scrollIntoView({behavior:'smooth',block:'start'})}
function planCal(){const y=calP.getFullYear(),mo=calP.getMonth(),off=(new Date(y,mo,1).getDay()+6)%7,days=new Date(y,mo+1,0).getDate(),up=tuesdays(),today=dk(new Date());
 let c='';for(let i=0;i<off;i++)c+='<div></div>';
 for(let d=1;d<=days;d++){const dt=new Date(y,mo,d),k=dk(dt),s=S.sessions[k],ring=k===today?'ring-2 ring-indigo-400 ':'';
  c+=up.includes(k)?`<button class="${ring}aspect-square rounded-lg text-sm font-bold ${s&&s.cancelled?'bg-gray-400':'bg-indigo-700'} text-white" onclick="goS('${k}')">${d}<div class="text-[9px] font-normal">${s&&s.cancelled?'Hủy':s&&s.open?'Mở':'Chờ'}</div></button>`
  :(isAdmin()&&dt.getDay()===2&&k<=today)?`<button class="${ring}aspect-square rounded-lg flex flex-col items-center justify-center text-sm ${hasPlan(s)?'bg-indigo-100 text-indigo-900 font-bold':'bg-gray-100 text-gray-600'}" onclick="openPast('${k}')">${d}${hasPlan(s)?`<div class="text-[9px]">${s.cancelled?'Hủy':s.settled?'✓':'●'}</div>`:''}</button>`:`<div class="${ring}aspect-square rounded-lg flex flex-col items-center justify-center text-sm ${hasPlan(s)?'bg-indigo-100 text-indigo-900 font-bold':dt.getDay()===2?'text-gray-500':'text-gray-300'}">${d}${hasPlan(s)?'<div class="text-[9px]">●</div>':''}</div>`}
 return `<div class="card"><div class="flex items-center justify-between mb-2"><button class="btn g" onclick="calP=new Date(${y},${mo-1},1);render()">‹</button><b>Lịch tháng ${mo+1}/${y}</b><button class="btn g" onclick="calP=new Date(${y},${mo+1},1);render()">›</button></div>
