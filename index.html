<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dead badminton club</title>
  <script src="https://tailwindcss.com"></script>
  <script src="https://jsdelivr.net"></script>
  <style>
    body { background-color: #f8fafc; font-family: sans-serif; }
  </style>
</head>
<body class="text-slate-900">
  <div id="app" class="max-w-lg mx-auto min-h-screen bg-[#f8fafc] pb-20"></div>

  <div id="authModal" class="hidden fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl space-y-4">
      <div class="grid grid-cols-2 gap-1 bg-slate-100 p-1 rounded-xl text-xs font-semibold">
        <button onclick="switchAuthTab('login')" id="tabLogin" class="py-1.5 rounded-lg bg-white text-slate-900">
          Đăng nhập
        </button>
        <button onclick="switchAuthTab('register')" id="tabReg" class="py-1.5 rounded-lg text-slate-500">
          + Đăng ký
        </button>
      </div>

      <div id="formLogin" class="space-y-3">
        <input id="loginUser" type="text" placeholder="Tài khoản hoặc Họ tên"
               class="w-full px-3 py-2 text-xs border rounded-xl">
        <input id="loginPass" type="password" placeholder="Mật khẩu"
               class="w-full px-3 py-2 text-xs border rounded-xl">
        <button onclick="handleLogin()"
                class="w-full py-2.5 bg-slate-900 text-white rounded-xl text-xs font-semibold">
          Đăng nhập
        </button>
      </div>

      <div id="formRegister" class="hidden space-y-2.5">
        <input id="regName" type="text" placeholder="Họ và tên *"
               class="w-full px-3 py-2 text-xs border rounded-xl">
        <input id="regNick" type="text" placeholder="Biệt danh"
               class="w-full px-3 py-2 text-xs border rounded-xl">
        <input id="regPass" type="password" placeholder="Mật khẩu *"
               class="w-full px-3 py-2 text-xs border rounded-xl">
        <div class="grid grid-cols-3 gap-2">
          <select id="regGender" class="px-2 py-2 text-xs border rounded-xl bg-white">
            <option value="Nam">👨 Nam</option>
            <option value="Nữ">👩 Nữ</option>
          </select>
          <select id="regLevel" class="px-2 py-2 text-xs border rounded-xl bg-white">
            <option value="TBY">TBY</option><option value="TB-">TB-</option>
            <option value="TB" selected>TB</option><option value="TB+">TB+</option>
            <option value="TB+++">TB+++</option><option value="Ẩn trình">🕵️ Ẩn</option>
          </select>
          <select id="regAvatar" class="px-2 py-2 text-xs border rounded-xl bg-white">
            <option value="🐶">🐶</option><option value="🐱">🐱</option><option value="🦊">🦊</option>
            <option value="🐼">🐼</option><option value="🐧">🐧</option><option value="🦩">🦩</option>
            <option value="🐳">🐳</option><option value="🐰">🐰</option><option value="🦁">🦁</option>
            <option value="🐯">🐯</option><option value="🐸">🐸</option><option value="🐵">🐵</option>
            <option value="🐨">🐨</option><option value="🐻">🐻</option><option value="🦄">🦄</option>
            <option value="🐙">🐙</option><option value="🦆">🦆</option><option value="🦉">🦉</option>
            <option value="🐺">🐺</option>
          </select>
        </div>
        <button onclick="handleRegister()"
                class="w-full py-2.5 bg-slate-900 text-white rounded-xl text-xs font-semibold">
          Gửi yêu cầu
        </button>
      </div>

      <button onclick="toggleAuthModal(false)"
              class="w-full py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-semibold">
        Đóng
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
