<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dead badminton club</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }</style>
</head>
<body class="text-slate-900">
  <div id="app" class="max-w-lg mx-auto min-h-screen bg-[#f8fafc] pb-14"></div>

  <!-- Modal Đăng nhập / Đăng ký -->
  <div id="loginModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl space-y-4">
      <div class="grid grid-cols-2 gap-1 bg-slate-100 p-1 rounded-xl text-xs font-semibold">
        <button onclick="switchAuthTab('register')" id="tabReg" class="py-1.5 rounded-lg bg-white text-slate-900 shadow-xs">+ Đăng ký mới</button>
        <button onclick="switchAuthTab('existing')" id="tabExt" class="py-1.5 rounded-lg text-slate-500">Chọn thành viên</button>
      </div>
      <div id="formRegister" class="space-y-2.5">
        <input id="inpName" type="text" placeholder="Họ và tên *" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl">
        <input id="inpNick" type="text" placeholder="Biệt danh (Nickname)" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl">
        <div class="grid grid-cols-3 gap-2">
          <select id="inpGender" class="px-2 py-2 text-xs border border-slate-200 rounded-xl bg-white">
            <option value="Nam">👨 Nam</option>
            <option value="Nữ">👩 Nữ</option>
          </select>
          <select id="inpLevel" class="px-2 py-2 text-xs border border-slate-200 rounded-xl bg-white">
            <option value="TBY">TBY</option>
            <option value="TB-">TB-</option>
            <option value="TB" selected>TB</option>
            <option value="TB+">TB+</option>
            <option value="TB+++">TB+++</option>
          </select>
          <select id="inpAvatar" class="px-2 py-2 text-xs border border-slate-200 rounded-xl bg-white">
            <option value="🐶">🐶</option><option value="🐱">🐱</option><option value="🦊">🦊</option>
            <option value="🐼">🐼</option><option value="🐧">🐧</option><option value="🦩">🦩</option>
            <option value="🐳">🐳</option><option value="🐰">🐰</option><option value="🦁">🦁</option>
          </select>
        </div>
        <button onclick="registerUser()" class="w-full py-2.5 bg-slate-900 text-white rounded-xl text-xs font-semibold">Gửi yêu cầu tham gia</button>
      </div>
      <div id="listExisting" class="hidden space-y-1.5 max-h-60 overflow-y-auto"></div>
      <button onclick="toggleModal('loginModal', false)" class="w-full py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-semibold">Đóng</button>
    </div>
  </div>

  <!-- Modal Quỹ & Quản trị Host -->
  <div id="fundModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-xl max-h-[90vh] overflow-y-auto space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-base">💰 Quỹ & Tài chính CLB</h3>
        <button onclick="toggleModal('fundModal', false)" class="text-slate-400 hover:text-slate-700 font-bold">✕</button>
      </div>
      <div id="fundContent"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://elgqrntzgorlvcpeytef.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZ3FybnR6Z29ybHZjcGV5dGVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU0MDY2MzAsImV4cCI6MjExMDk4MjYzMH0._WlajI9gcKX2PBj3n9WpZNL6HaIjRRlX3KrxvpB78fg';
    const HOST_PIN = '0902';
    const GUEST_FEE = 75000;
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function getUpcomingTuesdays() {
      const list = [], now = new Date();
      let diff = (2 - now.getDay() + 7) % 7;
      for (let i = 0; i < 4; i++) {
        const d = new Date(now);
        d.setDate(now.getDate() + diff + i * 7);
        const dd = String(d.getDate()).padStart(2, '0'), mm = String(d.getMonth() + 1).padStart(2, '0'), yyyy = d.getFullYear();
        list.push({ key: `${yyyy}-${mm}-${dd}`, short: `T3 (${dd}/${mm})`, full: `Thứ Ba, ${dd}/${mm}/${yyyy}` });
      }
      return list;
    }

    const tuesdays = getUpcomingTuesdays();
    let activeTab = 0, showUnvoted = false, isHostUnlocked = false, syncStatus = 'Đang kết nối...';
    let currentUserId = Number(localStorage.getItem('dbc_uid')) || null;
    let state = { users: [], sessions: {}, transactions: [] };

    const fmtMoney = n => (n || 0).toLocaleString('vi-VN') + 'đ';
    const getUser = id => state.users.find(u => u.id === id);
    const getSession = key => state.sessions[key] || { votes: [], guests: 0 };

    function getLevelBadge(lvl) {
      return { 'TB+++': 'bg-rose-50 text-rose-700 border-rose-200', 'TB+': 'bg-purple-50 text-purple-700 border-purple-200', 'TB': 'bg-blue-50 text-blue-700 border-blue-200', 'TB-': 'bg-amber-50 text-amber-700 border-amber-200' }[lvl] || 'bg-slate-100 text-slate-600 border-slate-200';
    }

    async function initSync() {
      const { data, error } = await db.from('club_data').select('state').eq('id', 'main').single();
      if (data && data.state) {
        state = { users: [], sessions: {}, transactions: [], ...data.state };
        syncStatus = 'Online';
      } else if (error && error.code === 'PGRST116') {
        await db.from('club_data').insert({ id: 'main', state });
        syncStatus = 'Online';
      } else { syncStatus = 'Lỗi kết nối'; }
      render();

      db.channel('club_realtime').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'club_data', filter: 'id=eq.main' }, payload => {
        if (payload.new && payload.new.state) { state = payload.new.state; render(); }
      }).subscribe();
    }

    async function pushState() {
      render();
      await db.from('club_data').upsert({ id: 'main', state, updated_at: new Date().toISOString() });
    }

    function render() {
      const t = tuesdays[activeTab], s = getSession(t.key);
      const validVotes = (s.votes || []).filter(uid => getUser(uid)?.approved);
      const guests = s.guests || 0, total = validVotes.length + guests, isFull = total >= 9;
      const curUser = getUser(currentUserId), isVoted = curUser && validVotes.includes(curUser.id);
      const approvedUsers = state.users.filter(u => u.approved), pendingUsers = state.users.filter(u => !u.approved);
      const unvoted = approvedUsers.filter(u => !validVotes.includes(u.id));

      document.getElementById('app').innerHTML = `
        <header class="bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 py-3 sticky top-0 z-20 flex justify-between items-center">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-slate-900 text-white flex items-center justify-center text-sm">🏸</div>
            <div>
              <h1 class="font-bold text-sm leading-tight">Dead badminton club</h1>
              <span class="inline-flex items-center gap-1 text-[10px] font-medium ${syncStatus === 'Online' ? 'text-emerald-600' : 'text-amber-600'}">
                <span class="w-1.5 h-1.5 rounded-full ${syncStatus === 'Online' ? 'bg-emerald-500' : 'bg-amber-500'}"></span>${syncStatus}
              </span>
            </div>
          </div>
          <div class="flex items-center gap-1.5">
            <button onclick="openFund()" class="relative bg-amber-50 text-amber-800 border border-amber-200 font-semibold px-2.5 py-1.5 rounded-lg text-xs">
              💰 Quỹ CLB ${isHostUnlocked && pendingUsers.length > 0 ? `<span class="ml-1 bg-red-500 text-white px-1.5 rounded-full text-[10px]">${pendingUsers.length}</span>` : ''}
            </button>
            ${!curUser
              ? `<button onclick="toggleModal('loginModal', true)" class="bg-slate-900 text-white font-medium px-3 py-1.5 rounded-lg text-xs">Đăng nhập</button>`
              : `<div class="flex items-center gap-1.5 bg-slate-100 border px-2 py-1 rounded-lg text-xs font-medium">
                  <span>${curUser.avatar} ${curUser.nickname}</span>
                  <button onclick="logout()" class="text-slate-400 hover:text-red-500">✕</button>
                </div>`}
          </div>
        </header>

        <main class="p-4 space-y-4">
          <div class="grid grid-cols-4 gap-1.5 bg-slate-200/70 p-1 rounded-xl">
            ${tuesdays.map((item, idx) => {
              const sess = getSession(item.key);
              const cnt = (sess.votes || []).filter(uid => getUser(uid)?.approved).length + (sess.guests || 0);
              return `<button onclick="activeTab=${idx};render()" class="py-2 px-1 rounded-lg text-[11px] font-semibold flex flex-col items-center ${activeTab === idx ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600'}">
                <span>${item.short}</span>
                <span class="mt-0.5 px-1.5 rounded text-[10px] font-bold ${activeTab === idx ? 'bg-slate-900 text-white' : 'bg-slate-300 text-slate-700'}">${cnt}/9</span>
              </button>`;
            }).join('')}
          </div>

          <div class="bg-white rounded-2xl p-4 shadow-xs border border-slate-200/80 space-y-3.5">
            <div class="flex justify-between items-start">
              <div>
                <h2 class="font-bold text-lg">${t.full}</h2>
                <p class="text-slate-500 text-sm font-medium mt-0.5">17:30 - 19:30</p>
              </div>
              <span class="px-2.5 py-1 rounded-full text-xs font-semibold border ${isFull ? 'bg-red-50 text-red-600 border-red-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200'}">
                ${isFull ? 'Hết slot' : 'Đang vote'}
              </span>
            </div>

            <div class="flex items-center justify-between text-sm pt-1">
              <div>Tham gia: <strong class="text-base font-extrabold">${total}/9</strong> <span class="text-slate-500 text-xs">người ${guests > 0 ? `(gồm ${guests} vãng lai)` : ''}</span></div>
              ${curUser && curUser.approved ? `<span class="text-xs font-semibold ${curUser.balance < 0 ? 'text-red-600' : 'text-emerald-600'}">Số dư: ${fmtMoney(curUser.balance)}</span>` : ''}
            </div>

            ${isHostUnlocked ? `
              <div class="flex items-center justify-between bg-amber-50/80 px-3 py-2 rounded-xl border border-amber-200 text-xs">
                <span class="font-semibold text-amber-900">👑 Khách vãng lai (75k/người):</span>
                <div class="flex items-center gap-2">
                  <button onclick="changeGuest(-1)" ${guests <= 0 ? 'disabled' : ''} class="w-6 h-6 rounded bg-white border font-bold disabled:opacity-30">-1</button>
                  <span class="font-bold text-sm w-4 text-center">${guests}</span>
                  <button onclick="changeGuest(1)" ${isFull ? 'disabled' : ''} class="w-6 h-6 rounded bg-white border font-bold disabled:opacity-30">+1</button>
                </div>
              </div>` : ''}

            <div class="pt-2 border-t border-slate-100">
              ${!curUser
                ? `<button onclick="toggleModal('loginModal', true)" class="w-full py-2.5 bg-slate-900 text-white font-semibold rounded-xl text-xs">Đăng nhập / Đăng ký để vote</button>`
                : !curUser.approved
                  ? `<div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-800 text-center font-medium">⏳ Tài khoản đang chờ Host duyệt để tham gia vote.</div>`
                  : `<button onclick="toggleVote()" ${!isVoted && isFull ? 'disabled' : ''} class="w-full py-2.5 rounded-xl font-semibold text-xs border transition ${isVoted ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-800 border-slate-300 hover:bg-slate-50 disabled:opacity-40'}">
                      ${isVoted ? '✓ Đã báo danh (Bấm để hủy)' : (isFull ? 'Đã hết slot (9/9)' : '🏸 Báo danh tham gia')}
                    </button>`}
            </div>
          </div>

          <div class="flex justify-between items-center pt-1">
            <h3 class="font-bold text-base">Danh sách (${validVotes.length} hội viên${guests > 0 ? ` + ${guests} vãng lai` : ''})</h3>
            ${isFull ? `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-red-100 text-red-600">Hết slot</span>` : ''}
          </div>

          <div class="space-y-2">
            ${total === 0 ? `<div class="text-center py-8 bg-white rounded-xl border border-dashed text-xs text-slate-400">Chưa có ai điểm danh buổi này.</div>` : ''}
            ${validVotes.map(uid => {
              const u = getUser(uid);
              return `<div class="bg-white px-3.5 py-3 rounded-xl border border-slate-200/80 flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="text-2xl w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center">${u.avatar}</div>
                  <div>
                    <div class="flex items-center gap-1.5 flex-wrap">
                      <span class="text-[11px] font-bold px-2 py-0.5 rounded-md border ${getLevelBadge(u.level)}">${u.level}</span>
                      <span class="font-bold text-sm">${u.name}</span>
                      <span class="text-[10px] px-1.5 py-0.5 rounded ${u.gender === 'Nữ' ? 'bg-pink-50 text-pink-600' : 'bg-sky-50 text-sky-600'}">${u.gender}</span>
                    </div>
                    <div class="text-xs text-slate-500 mt-0.5">(${u.nickname})</div>
                  </div>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-xs font-semibold px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700">🏸 Tham gia</span>
                  ${isHostUnlocked ? `<button onclick="removeVote(${u.id})" class="text-red-400 hover:text-red-600 text-xs font-bold px-1">✕</button>` : ''}
                </div>
              </div>`;
            }).join('')}
            ${guests > 0 ? `<div class="bg-amber-50/60 px-3.5 py-3 rounded-xl border border-amber-200/80 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="text-xl w-10 h-10 rounded-full bg-amber-100 flex items-center justify-center">🏃</div>
                <div>
                  <div class="font-bold text-sm text-amber-950">Khách vãng lai (x${guests})</div>
                  <div class="text-xs text-amber-700">Thu cố định: ${fmtMoney(GUEST_FEE)}/người</div>
                </div>
              </div>
              <span class="text-xs font-bold text-amber-800">${fmtMoney(guests * GUEST_FEE)}</span>
            </div>` : ''}
          </div>

          <div class="pt-2">
            <button onclick="showUnvoted=!showUnvoted;render()" class="w-full bg-white px-4 py-3 rounded-xl border border-slate-200/80 flex justify-between items-center text-sm font-semibold text-slate-600">
              <span>Chưa vote (${unvoted.length})</span>
              <span class="text-xs text-slate-400">${showUnvoted ? 'Thu gọn ▲' : 'Xem chi tiết ▼'}</span>
            </button>
            ${showUnvoted ? `<div class="mt-2 bg-white p-3.5 rounded-xl border border-slate-200/80 flex flex-wrap gap-2">
              ${unvoted.length === 0 ? `<span class="text-xs text-slate-400">Tất cả hội viên đã vote!</span>` : unvoted.map(u => `<span class="inline-flex items-center gap-1 text-xs bg-slate-50 border px-2.5 py-1 rounded-lg">${u.avatar} <b>${u.name}</b></span>`).join('')}
            </div>` : ''}
          </div>
        </main>`;

      document.getElementById('listExisting').innerHTML = state.users.length === 0
        ? `<div class="text-center py-4 text-xs text-slate-400">Chưa có thành viên nào. Hãy đăng ký mới!</div>`
        : state.users.map(u => `<button onclick="loginAs(${u.id})" class="w-full flex items-center justify-between p-2.5 hover:bg-slate-50 rounded-xl border text-left">
            <div class="flex items-center gap-2.5">
              <span class="text-xl w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center">${u.avatar}</span>
              <div>
                <div class="font-bold text-xs">${u.name} ${!u.approved ? '<span class="text-amber-600">(Chờ duyệt)</span>' : ''}</div>
                <div class="text-[11px] text-slate-500">${u.gender} • ${u.level}</div>
              </div>
            </div>
            <span class="text-slate-400 text-xs font-semibold">Chọn →</span>
          </button>`).join('');

      if (!document.getElementById('fundModal').classList.contains('hidden')) renderFundModal();
    }

    function toggleModal(id, show) { document.getElementById(id).classList.toggle('hidden', !show); }
    function switchAuthTab(tab) {
      document.getElementById('formRegister').classList.toggle('hidden', tab !== 'register');
      document.getElementById('listExisting').classList.toggle('hidden', tab !== 'existing');
      document.getElementById('tabReg').className = tab === 'register' ? 'py-1.5 rounded-lg bg-white text-slate-900 shadow-xs' : 'py-1.5 rounded-lg text-slate-500';
      document.getElementById('tabExt').className = tab === 'existing' ? 'py-1.5 rounded-lg bg-white text-slate-900 shadow-xs' : 'py-1.5 rounded-lg text-slate-500';
    }

    async function registerUser() {
      const name = document.getElementById('inpName').value.trim();
      if (!name) return alert('Vui lòng nhập họ tên!');
      const u = { id: Date.now(), name, nickname: document.getElementById('inpNick').value.trim() || name, gender: document.getElementById('inpGender').value, level: document.getElementById('inpLevel').value, avatar: document.getElementById('inpAvatar').value, balance: 0, approved: false };
      state.users.push(u);
      currentUserId = u.id; localStorage.setItem('dbc_uid', u.id);
      toggleModal('loginModal', false);
      await pushState();
    }

    function loginAs(id) { currentUserId = id; localStorage.setItem('dbc_uid', id); toggleModal('loginModal', false); render(); }
    function logout() { currentUserId = null; localStorage.removeItem('dbc_uid'); render(); }

    async function toggleVote() {
      const key = tuesdays[activeTab].key, s = getSession(key);
      const valid = (s.votes || []).filter(uid => getUser(uid)?.approved);
      if (valid.includes(currentUserId)) s.votes = valid.filter(uid => uid !== currentUserId);
      else {
        if (valid.length + (s.guests || 0) >= 9) return alert('Đã đủ 9 slot!');
        s.votes = [...valid, currentUserId];
      }
      state.sessions[key] = s;
      await pushState();
    }

    async function removeVote(uid) {
      const key = tuesdays[activeTab].key, s = getSession(key);
      s.votes = (s.votes || []).filter(id => id !== uid);
      state.sessions[key] = s;
      await pushState();
    }

    async function changeGuest(d) {
      const key = tuesdays[activeTab].key, s = getSession(key);
      const validCount = (s.votes || []).filter(uid => getUser(uid)?.approved).length;
      const next = (s.guests || 0) + d;
      if (next < 0 || validCount + next > 9) return;
      s.guests = next;
      state.sessions[key] = s;
      await pushState();
    }

    function openFund() { toggleModal('fundModal', true); renderFundModal(); }
    function unlockHost() {
      if (document.getElementById('hostPinInput').value === HOST_PIN) { isHostUnlocked = true; render(); }
      else alert('Sai mã PIN!');
    }

    function renderFundModal() {
      const approved = state.users.filter(u => u.approved), pending = state.users.filter(u => !u.approved);
      const totalFund = approved.reduce((a, u) => a + (u.balance || 0), 0);

      document.getElementById('fundContent').innerHTML = `
        <div class="bg-slate-900 text-white p-3.5 rounded-xl flex justify-between items-center mb-3">
          <div><div class="text-[11px] text-slate-400">Tổng quỹ hội viên</div><div class="text-lg font-extrabold">${fmtMoney(totalFund)}</div></div>
          ${!isHostUnlocked
            ? `<div class="flex gap-1.5"><input id="hostPinInput" type="password" placeholder="PIN Host" class="w-20 px-2 py-1 text-xs rounded-lg text-slate-900"><button onclick="unlockHost()" class="bg-amber-500 text-slate-950 font-bold px-2.5 py-1 rounded-lg text-xs">Mở khóa</button></div>`
            : `<span class="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2.5 py-1 rounded-lg font-semibold">👑 Quyền Host</span>`}
        </div>

        ${isHostUnlocked && pending.length > 0 ? `
          <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl space-y-2 mb-3">
            <div class="text-xs font-bold text-amber-900">🔔 Chờ duyệt thành viên (${pending.length})</div>
            ${pending.map(u => `<div class="flex justify-between items-center bg-white p-2 rounded-lg border text-xs">
              <span>${u.avatar} <b>${u.name}</b> (${u.gender} - ${u.level})</span>
              <div class="flex gap-1">
                <button onclick="approveUser(${u.id}, true)" class="bg-emerald-600 text-white px-2 py-1 rounded font-semibold">Duyệt</button>
                <button onclick="approveUser(${u.id}, false)" class="bg-red-100 text-red-600 px-2 py-1 rounded font-semibold">Xóa</button>
              </div>
            </div>`).join('')}
          </div>` : ''}

        ${isHostUnlocked ? `
          <div class="bg-slate-50 border border-slate-200 p-3 rounded-xl space-y-2.5 mb-3">
            <div class="text-xs font-bold text-slate-800">🧮 Chia tiền buổi đánh (Nữ = 80% Nam, Vãng lai = 75k)</div>
            <select id="splitSession" onchange="calcPreview()" class="w-full px-2.5 py-1.5 text-xs border rounded-lg bg-white">
              ${tuesdays.map(t => `<option value="${t.key}">${t.full}</option>`).join('')}
            </select>
            <div class="grid grid-cols-2 gap-2">
              <input id="courtFee" oninput="calcPreview()" type="number" placeholder="Tiền sân (VNĐ)" class="px-2.5 py-1.5 text-xs border rounded-lg bg-white">
              <input id="shuttleFee" oninput="calcPreview()" type="number" placeholder="Tiền cầu (VNĐ)" class="px-2.5 py-1.5 text-xs border rounded-lg bg-white">
            </div>
            <div id="splitPreview" class="text-[11px] text-slate-600 bg-white p-2 rounded-lg border">Nhập tiền sân & cầu để xem mức chia...</div>
            <button onclick="executeSplit()" class="w-full py-2 bg-slate-900 text-white rounded-lg text-xs font-semibold">Chốt & Trừ tiền hội viên</button>
          </div>

          <div class="bg-slate-50 border border-slate-200 p-3 rounded-xl space-y-2 mb-3">
            <div class="text-xs font-bold text-slate-800">💳 Nạp / Trừ tiền lẻ</div>
            <div class="grid grid-cols-2 gap-2">
              <select id="txUser" class="px-2 py-1.5 text-xs border rounded-lg bg-white">${approved.map(u => `<option value="${u.id}">${u.name}</option>`).join('')}</select>
              <input id="txAmount" type="number" placeholder="Số tiền (VNĐ)" class="px-2 py-1.5 text-xs border rounded-lg bg-white">
            </div>
            <input id="txNote" type="text" placeholder="Ghi chú (VD: Đóng quỹ tháng)" class="w-full px-2.5 py-1.5 text-xs border rounded-lg bg-white">
            <div class="grid grid-cols-2 gap-2">
              <button onclick="addTx(1)" class="py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-semibold">+ Nạp tiền</button>
              <button onclick="addTx(-1)" class="py-1.5 bg-red-600 text-white rounded-lg text-xs font-semibold">- Trừ tiền</button>
            </div>
          </div>` : ''}

        <div class="space-y-1.5 mb-3">
          <div class="text-xs font-bold text-slate-700">Số dư từng hội viên (${approved.length})</div>
          ${approved.map(u => `<div class="flex justify-between items-center px-3 py-2 bg-white border rounded-xl text-xs">
            <span>${u.avatar} <b>${u.name}</b> <span class="text-slate-400">(${u.gender})</span></span>
            <span class="font-bold ${(u.balance || 0) < 0 ? 'text-red-600' : 'text-emerald-600'}">${fmtMoney(u.balance)}</span>
          </div>`).join('')}
        </div>

        <div class="space-y-1.5">
          <div class="text-xs font-bold text-slate-700">Lịch sử thu chi gần đây</div>
          <div class="max-h-40 overflow-y-auto space-y-1">
            ${(state.transactions || []).length === 0 ? `<div class="text-xs text-slate-400">Chưa có giao dịch nào.</div>` : state.transactions.slice(0, 20).map(tx => `
              <div class="flex justify-between items-center text-[11px] bg-slate-50 px-2.5 py-1.5 rounded-lg border">
                <div><b>${tx.userName}</b>: ${tx.note}<div class="text-[10px] text-slate-400">${tx.time}</div></div>
                <span class="font-bold ${tx.amount >= 0 ? 'text-emerald-600' : 'text-red-600'}">${tx.amount >= 0 ? '+' : ''}${fmtMoney(tx.amount)}</span>
              </div>`).join('')}
          </div>
        </div>`;
    }

    async function approveUser(id, ok) {
      if (ok) { const u = getUser(id); if (u) u.approved = true; }
      else state.users = state.users.filter(u => u.id !== id);
      await pushState();
    }

    function getSplitData() {
      const key = document.getElementById('splitSession').value, s = getSession(key);
      const players = (s.votes || []).map(uid => getUser(uid)).filter(u => u && u.approved);
      const guests = s.guests || 0, totalCost = (Number(document.getElementById('courtFee').value) || 0) + (Number(document.getElementById('shuttleFee').value) || 0);
      const remain = Math.max(0, totalCost - guests * GUEST_FEE);
      const weight = players.reduce((a, u) => a + (u.gender === 'Nữ' ? 0.8 : 1), 0);
      const maleFee = weight > 0 ? Math.round(remain / weight) : 0, femaleFee = Math.round(maleFee * 0.8);
      return { key, players, guests, totalCost, remain, maleFee, femaleFee };
    }

    function calcPreview() {
      const d = getSplitData();
      document.getElementById('splitPreview').innerHTML = `Tổng: <b>${fmtMoney(d.totalCost)}</b> - Vãng lai (${d.guests}x75k): <b>${fmtMoney(d.guests * GUEST_FEE)}</b> = Còn lại: <b>${fmtMoney(d.remain)}</b><br>👉 Nam: <b class="text-blue-600">${fmtMoney(d.maleFee)}</b>/người • Nữ: <b class="text-pink-600">${fmtMoney(d.femaleFee)}</b>/người`;
    }

    async function executeSplit() {
      const d = getSplitData();
      if (d.totalCost <= 0 || d.players.length === 0) return alert('Vui lòng nhập chi phí và đảm bảo buổi đánh có hội viên tham gia!');
      const now = new Date().toLocaleString('vi-VN');
      d.players.forEach(u => {
        const fee = u.gender === 'Nữ' ? d.femaleFee : d.maleFee;
        u.balance = (u.balance || 0) - fee;
        state.transactions.unshift({ userName: u.name, amount: -fee, note: `Tiền cầu ${d.key}`, time: now });
      });
      await pushState();
      alert('Đã chốt sổ và trừ tiền thành công!');
    }

    async function addTx(sign) {
      const uid = Number(document.getElementById('txUser').value), amt = Math.abs(Number(document.getElementById('txAmount').value));
      const note = document.getElementById('txNote').value.trim() || (sign > 0 ? 'Nạp quỹ' : 'Trừ quỹ');
      const u = getUser(uid);
      if (!u || !amt) return alert('Vui lòng nhập số tiền hợp lệ!');
      u.balance = (u.balance || 0) + sign * amt;
      state.transactions.unshift({ userName: u.name, amount: sign * amt, note, time: new Date().toLocaleString('vi-VN') });
      await pushState();
    }

    initSync();
  </script>
</body>
</html>
